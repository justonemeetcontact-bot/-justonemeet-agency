<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIMPLIFY — YOUR SUCCESS</title>
<style>
  /* ============================================================
     SIMPLIFY · YOUR SUCCESS
     Pixel-recreated from a 756 × 315 reference image. The stage is
     a fixed 756×315 element scaled with transform to fit, so every
     measured coordinate stays exact.

     Layer order (bottom → top):
       ambient wash → beam layers → grid (screen-blend, gets lit by
       the beam) → pill → seam → labels → dust → vignette
     ============================================================ */

  :root{
    --green:     #42cf13;
    --green-hot: #6bff1e;
    --label-fs:  20px;
    --center-y:  157px;
    /* horizontal falloff, measured from the reference (reaches 0 at x≈646) */
    --beam-g:
      linear-gradient(90deg,
        rgba(66,206,17,.30) 1.7%,
        rgba(66,206,17,.72) 8.6%,
        rgba(66,206,17,.76) 15.5%,
        rgba(66,206,17,.78) 22.4%,
        rgba(66,206,17,.64) 29.3%,
        rgba(66,206,17,.34) 36.2%,
        rgba(66,206,17,.26) 43.1%,
        rgba(66,206,17,.12) 50%,
        rgba(66,206,17,.08) 56.9%,
        rgba(66,206,17,.065) 63.8%,
        rgba(66,206,17,.055) 70.7%,
        rgba(66,206,17,.032) 77.6%,
        rgba(66,206,17,.016) 84.5%,
        rgba(66,206,17,.007) 91.4%,
        rgba(66,206,17,.00) 98.3%);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background:#000; overflow:hidden;
    font-family:'Archivo','Inter','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  }

  .viewport{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  .stage{
    position:relative;
    width:756px; height:315px;
    background:#000;
    transform-origin:center center;
    overflow:hidden;
  }

  /* ================= AMBIENT WASH ================= */
  .ambient{
    position:absolute; z-index:1;
    left:356px; top:-40px; width:380px; height:395px;
    background:
      radial-gradient(58% 48% at 10% 50%, rgba(70,220,24,.06), transparent 70%),
      radial-gradient(62% 55% at 74% 46%, rgba(48,170,15,.05), transparent 72%);
    filter:blur(22px);
    opacity:.8;
  }

  /* ================= BEAM ================= */
  .beam-group{ position:absolute; inset:0; z-index:2; }
  .beam{
    position:absolute; left:361px; top:0; height:315px; width:290px;
    transform-origin:0px var(--center-y);
    pointer-events:none;
    /* nothing may paint left of the seam — the pill interior stays dark */
    -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 1.5px, #000 100%);
    mask-image:linear-gradient(90deg, transparent 0, #000 1.5px, #000 100%);
  }
  /* light column hugging the seam (tall + narrow near x≈355-415) */
  .beam .column{
    position:absolute; left:-6px; top:calc(var(--center-y) - 95px);
    width:60px; height:170px;
    background:radial-gradient(50% 50% at 50% 50%, rgba(70,220,25,.06), transparent 70%);
    filter:blur(8px);
  }
  /* hot burst right at the seam */
  .beam .tip{
    position:absolute; left:0px; top:calc(var(--center-y) - 21px);
    width:130px; height:42px;
    background:radial-gradient(50% 50% at 18% 50%, rgba(128,252,60,1), rgba(76,215,24,.55) 60%, transparent 80%);
    filter:blur(4.5px);
  }
  /* the streak — same horizontal falloff, two vertical widths,
     stacked ≈ gaussian vertical softness */
  .streak{
    position:absolute; left:0px; top:0; height:315px; width:290px;
    background:var(--beam-g);
    transform-origin:0px var(--center-y);
  }
  .streak.core{ top:calc(var(--center-y) - 42px); height:84px;  filter:blur(6px);  opacity:1;   --b:6px;
    -webkit-mask-image:linear-gradient(180deg, transparent 0%, #000 22%, #000 78%, transparent 100%);
    mask-image:linear-gradient(180deg, transparent 0%, #000 22%, #000 78%, transparent 100%); }
  .streak.mid { top:calc(var(--center-y) - 50px); height:100px; filter:blur(10px); opacity:.34; --b:10px;
    -webkit-mask-image:linear-gradient(180deg, transparent 2%, #000 26%, #000 74%, transparent 98%);
    mask-image:linear-gradient(180deg, transparent 2%, #000 26%, #000 74%, transparent 98%); }
  /* the big soft fireball: boxy slab (masked) + ellipse shoulders */
  .fog{
    position:absolute; left:0px; top:82px; width:290px; height:150px;
    background:linear-gradient(90deg,
      rgba(52,192,14,.07) 0%,
      rgba(54,195,15,.13) 12%,
      rgba(54,195,15,.16) 15%,
      rgba(54,195,15,.20) 30%,
      rgba(54,195,15,.20) 50%,
      rgba(52,190,14,.14) 70%,
      rgba(48,184,12,.08) 85%,
      transparent 100%);
    -webkit-mask-image:linear-gradient(180deg, transparent 9%, #000 27%, #000 55%, rgba(0,0,0,.5) 66%, transparent 79%);
    mask-image:linear-gradient(180deg, transparent 9%, #000 27%, #000 55%, rgba(0,0,0,.5) 66%, transparent 79%);
    filter:blur(8px);
  }
  .fog2{
    position:absolute; left:6px; top:47px; width:225px; height:220px;
    background:radial-gradient(50% 50% at 48% 50%,
      rgba(56,196,15,.30) 0%,
      rgba(52,192,14,.25) 33%,
      rgba(48,184,12,.12) 58%,
      rgba(42,175,10,.035) 76%,
      transparent 88%);
    filter:blur(10px);
  }
  /* upper-middle shoulder hump ≈ center (515,105) */
  .flare{
    position:absolute; left:100px; top:45px; width:130px; height:120px;
    background:radial-gradient(50% 50% at 50% 50%,
      rgba(52,190,14,.46) 0%,
      rgba(48,182,12,.22) 55%,
      transparent 84%);
    filter:blur(7px);
  }
  /* lower shoulder under the beam ≈ center (485,197) */
  .under{
    position:absolute; left:64px; top:140px; width:150px; height:120px;
    background:radial-gradient(50% 50% at 45% 50%,
      rgba(50,188,13,.32) 0%,
      rgba(46,180,11,.14) 55%,
      transparent 82%);
    filter:blur(11px);
  }
  /* faint veil continuing to the right (dies off before the edge) */
  .veil{
    position:absolute; left:225px; top:35px; width:130px; height:240px;
    background:radial-gradient(50% 50% at 30% 50%,
      rgba(50,185,13,.035) 0%,
      rgba(46,178,11,.015) 55%,
      transparent 78%);
    filter:blur(12px);
  }
  /* grid lines y=62 & y=227 catching the beam light are now drawn as
     full-width elements in the .grid layer (see .h1 / .h3 above) */

  /* ================= GRID (screen-blends → gets lit by beam) =================
     Each line is drawn individually with the brightness profile measured
     from the reference: full-width horizontals at y=62/144/227 and
     verticals at x=82/176/269/364/457/550/644/737, each dimming and
     brightening where the beam light falls. */
  .grid{
    position:absolute; inset:0; z-index:3;
    mix-blend-mode:screen;
    pointer-events:none;
  }
  .grid i{
    position:absolute;
    filter:blur(.6px);
  }
  .grid .v{ top:-2px; bottom:-2px; width:1.4px; }
  .grid .h{ left:-2px; right:-2px; height:1.4px; }

  /* --- verticals --- */
  .grid .v1{ left:81.3px; background:linear-gradient(180deg,
    rgba(190,235,170,0) 0%,
    rgba(190,235,170,.012) 8%,
    rgba(190,235,170,.045) 17%,
    rgba(190,235,170,.075) 26%,
    rgba(190,235,170,.115) 35%,
    rgba(190,235,170,.13) 44%,
    rgba(190,235,170,.10) 53%,
    rgba(190,235,170,.09) 61%,
    rgba(190,235,170,.065) 70%,
    rgba(190,235,170,.04) 79%,
    rgba(190,235,170,.012) 88%,
    rgba(190,235,170,0) 96%); }
  .grid .v2{ left:175.3px; background:linear-gradient(180deg,
    rgba(190,235,170,0) 0%,
    rgba(190,235,170,.028) 8%,
    rgba(190,235,170,.068) 17%,
    rgba(190,235,170,.12) 26%,
    rgba(190,235,170,.21) 35%,
    rgba(190,235,170,0) 39%,
    rgba(190,235,170,0) 61%,
    rgba(190,235,170,.16) 70%,
    rgba(190,235,170,.084) 79%,
    rgba(190,235,170,.032) 88%,
    rgba(190,235,170,0) 96%); }
  .grid .v3{ left:268.3px; background:linear-gradient(180deg,
    rgba(190,235,170,0) 0%,
    rgba(190,235,170,.016) 8%,
    rgba(190,235,170,.056) 17%,
    rgba(190,235,170,.104) 26%,
    rgba(190,235,170,.132) 35%,
    rgba(190,235,170,0) 39%,
    rgba(190,235,170,0) 61%,
    rgba(190,235,170,.112) 70%,
    rgba(190,235,170,.072) 79%,
    rgba(190,235,170,.024) 88%,
    rgba(190,235,170,0) 96%); }
  .grid .v4{ left:363.3px; background:linear-gradient(180deg,
    rgba(190,235,170,0) 0%,
    rgba(190,235,170,.02) 8%,
    rgba(190,235,170,.052) 17%,
    rgba(190,235,170,.16) 26%,
    rgba(190,235,170,.21) 35%,
    rgba(190,235,170,0) 39%,
    rgba(190,235,170,0) 62%,
    rgba(190,235,170,.08) 70%,
    rgba(190,235,170,.08) 79%,
    rgba(190,235,170,.035) 88%,
    rgba(190,235,170,.008) 96%,
    rgba(190,235,170,0) 100%); }
  .grid .v5{ left:456.3px; background:linear-gradient(180deg,
    rgba(190,235,170,0) 0%,
    rgba(190,235,170,.015) 8%,
    rgba(190,235,170,.04) 17%,
    rgba(190,235,170,.20) 26%,
    rgba(190,235,170,.22) 35%,
    rgba(190,235,170,.04) 43%,
    rgba(190,235,170,.06) 53%,
    rgba(190,235,170,.08) 61%,
    rgba(190,235,170,.14) 70%,
    rgba(190,235,170,.12) 79%,
    rgba(190,235,170,.08) 88%,
    rgba(190,235,170,.05) 96%,
    rgba(190,235,170,0) 100%); }
  .grid .v6{ left:549.3px; background:linear-gradient(180deg,
    rgba(190,235,170,0) 0%,
    rgba(190,235,170,.05) 8%,
    rgba(190,235,170,.12) 17%,
    rgba(190,235,170,.28) 26%,
    rgba(190,235,170,.46) 35%,
    rgba(190,235,170,.15) 44%,
    rgba(190,235,170,.10) 53%,
    rgba(190,235,170,.08) 61%,
    rgba(190,235,170,.07) 70%,
    rgba(190,235,170,.09) 79%,
    rgba(190,235,170,.04) 88%,
    rgba(190,235,170,.02) 95%,
    rgba(190,235,170,0) 100%); }
  .grid .v7{ left:643.3px; background:linear-gradient(180deg,
    rgba(190,235,170,0) 0%,
    rgba(190,235,170,.07) 8%,
    rgba(190,235,170,.15) 17%,
    rgba(190,235,170,.19) 26%,
    rgba(190,235,170,.31) 35%,
    rgba(190,235,170,.33) 43%,
    rgba(190,235,170,.16) 53%,
    rgba(190,235,170,.15) 61%,
    rgba(190,235,170,.25) 70%,
    rgba(190,235,170,.09) 79%,
    rgba(190,235,170,.04) 88%,
    rgba(190,235,170,0) 96%); }
  .grid .v8{ left:736.3px; background:linear-gradient(180deg,
    rgba(190,235,170,0) 0%,
    rgba(190,235,170,.005) 8%,
    rgba(190,235,170,.02) 17%,
    rgba(190,235,170,.075) 26%,
    rgba(190,235,170,.10) 35%,
    rgba(190,235,170,.12) 45%,
    rgba(190,235,170,.07) 53%,
    rgba(190,235,170,.06) 61%,
    rgba(190,235,170,.04) 70%,
    rgba(190,235,170,.02) 79%,
    rgba(190,235,170,.008) 88%,
    rgba(190,235,170,0) 96%); }

  /* --- horizontals --- */
  .grid .h1{ top:61.3px; background:linear-gradient(90deg,
    rgba(190,235,170,.025) 0%,
    rgba(190,235,170,.04) 6%,
    rgba(190,235,170,.06) 12%,
    rgba(190,235,170,.06) 18%,
    rgba(190,235,170,.08) 24%,
    rgba(190,235,170,.08) 30%,
    rgba(190,235,170,.08) 36%,
    rgba(190,235,170,.095) 42%,
    rgba(190,235,170,.09) 48%,
    rgba(190,235,170,.14) 54%,
    rgba(190,235,170,.07) 60%,
    rgba(190,235,170,.075) 66%,
    rgba(190,235,170,.075) 72%,
    rgba(190,235,170,.15) 78%,
    rgba(190,235,170,.13) 84%,
    rgba(190,235,170,.05) 90%,
    rgba(190,235,170,.04) 95%,
    rgba(190,235,170,.025) 100%); }
  .grid .h2{ top:143.3px; background:linear-gradient(90deg,
    rgba(190,235,170,.035) 0%,
    rgba(190,235,170,.08) 6%,
    rgba(190,235,170,.065) 12%,
    rgba(190,235,170,.07) 15%,
    rgba(190,235,170,0) 17%,
    rgba(190,235,170,0) 48%,
    rgba(190,235,170,0) 80%,
    rgba(190,235,170,.095) 84%,
    rgba(190,235,170,.08) 89%,
    rgba(190,235,170,.035) 95%,
    rgba(190,235,170,.005) 100%); }
  .grid .h3{ top:226.3px; background:linear-gradient(90deg,
    rgba(190,235,170,.02) 0%,
    rgba(190,235,170,.05) 6%,
    rgba(190,235,170,.07) 12%,
    rgba(190,235,170,.085) 18%,
    rgba(190,235,170,.10) 24%,
    rgba(190,235,170,.095) 30%,
    rgba(190,235,170,.12) 36%,
    rgba(190,235,170,.11) 42%,
    rgba(190,235,170,.13) 48%,
    rgba(190,235,170,.13) 54%,
    rgba(190,235,170,.13) 60%,
    rgba(190,235,170,.13) 66%,
    rgba(190,235,170,.15) 72%,
    rgba(190,235,170,.14) 78%,
    rgba(190,235,170,.11) 84%,
    rgba(190,235,170,.07) 90%,
    rgba(190,235,170,.04) 95%,
    rgba(190,235,170,.02) 100%); }

  /* ================= PILL (half-pill: left cap only) =================
     The reference has a fully rounded LEFT cap, top+bottom borders that
     run right and dissolve into the beam glow around x≈330-355, and NO
     right cap / NO right border — the open right edge IS the seam. */
  .pill{
    position:absolute; z-index:4;
    left:126px; top:118.5px; width:236px; height:79.5px;
    border-radius:39.75px 0 0 39.75px;
    background:
      linear-gradient(92deg, rgba(255,255,255,.05), rgba(255,255,255,.012) 46%, rgba(255,255,255,0) 75%, rgba(0,0,0,0)),
      #0a0b0a;   /* opaque interior: hides grid lines behind the pill */
    box-shadow:
      0 0 22px rgba(46,150,12,.09),
      inset -18px 0 24px -12px rgba(90,230,40,.09),
      inset 0 0 22px rgba(0,0,0,.5);
    cursor:pointer;
    user-select:none;
  }
  /* the border itself lives on ::before so it can fade out on the right */
  .pill::before{
    content:""; position:absolute; inset:0;
    border-radius:39.75px 0 0 39.75px;
    border:1.5px solid rgba(100,208,44,.40);
    border-right:0;
    -webkit-mask-image:linear-gradient(90deg,#000 0%,#000 66%,rgba(0,0,0,.55) 82%,transparent 95%);
    mask-image:linear-gradient(90deg,#000 0%,#000 66%,rgba(0,0,0,.55) 82%,transparent 95%);
  }
  .pill::after{
    content:""; position:absolute; inset:3px;
    border-radius:36.75px 0 0 36.75px;
    border:1px solid rgba(150,230,100,.06);
    border-right:0;
    -webkit-mask-image:linear-gradient(90deg,#000 0%,#000 72%,rgba(0,0,0,.5) 86%,transparent 97%);
    mask-image:linear-gradient(90deg,#000 0%,#000 72%,rgba(0,0,0,.5) 86%,transparent 97%);
  }
  .pill .label{
    position:absolute;
    left:75.5px; top:50%; transform:translateY(-50%);
    white-space:nowrap;
  }

  /* plus icon */
  .plus{
    position:absolute; z-index:5;
    left:159.5px; top:149.5px;
    width:19px; height:19px;
    pointer-events:none;
  }
  .plus svg{ width:19px; height:19px; display:block; overflow:visible;
    filter:drop-shadow(0 0 4px rgba(80,255,25,.75)) drop-shadow(0 0 11px rgba(60,220,10,.35)); }
  .plus-ring{
    position:absolute; z-index:5;
    left:159.5px; top:149.5px; width:19px; height:19px;
    border:1px solid rgba(120,255,60,.85);
    border-radius:50%;
    opacity:0; pointer-events:none;
  }

  /* seam — the bright open edge where light escapes.
     Bright core only in the middle band (y≈136-178); dim green tails
     fade above and below it, extending past the pill. */
  /* bright core strip — the light aperture (y≈133-181) */
  .seam{
    position:absolute; z-index:5;
    left:360.5px; top:135.5px; width:3px; height:46px;
    border-radius:2px;
    background:linear-gradient(180deg,
      rgba(180,255,80,.18) 0%,
      #47f901 6%,
      #47f901 94%,
      rgba(180,255,80,.18) 100%);
    box-shadow:
      0 0 6px 0 rgba(90,255,30,.36),
      0 0 14px 2px rgba(64,225,16,.15),
      0 0 34px 8px rgba(46,180,12,.06);
    /* clip the glow's left spill so the pill interior stays dark */
    -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 1.5px, #000 100%);
    mask-image:linear-gradient(90deg, transparent 0, #000 1.5px, #000 100%);
    pointer-events:none;
  }
  /* dim vertical continuation of the line above/below the aperture */
  .seam-tail{
    position:absolute; z-index:5;
    left:361.5px; top:112px; width:1.5px; height:88px;
    background:linear-gradient(180deg,
      rgba(140,255,60,0)   0%,
      rgba(150,255,65,.025)  9%,
      rgba(160,255,70,.055) 18%,
      rgba(180,255,80,.06) 26%,
      rgba(180,255,80,.055) 72%,
      rgba(160,255,70,.025) 84%,
      rgba(150,255,65,.012) 95%,
      rgba(140,255,60,0)  100%);
    -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 1px, #000 100%);
    mask-image:linear-gradient(90deg, transparent 0, #000 1px, #000 100%);
    pointer-events:none;
  }

  /* ================= LABELS ================= */
  .label{
    position:absolute; z-index:6;
    top:var(--center-y); transform:translateY(-50%);
    font-size:var(--label-fs);
    font-weight:600;
    color:#fdfdfd;
    white-space:nowrap;
    pointer-events:none;
  }
  .label .ch{ display:inline-block; white-space:pre; }
  .label.left{
    left:78px;               /* 204px on screen (relative to pill) */
    letter-spacing:.245em;
    color:#f6f6f6;
  }
  .label.right{
    left:388px;
    letter-spacing:.185em;
    color:#f4fef0;
    text-shadow:0 0 6px rgba(150,255,90,.22), 0 0 18px rgba(90,230,30,.12);
  }

  /* ================= DUST ================= */
  .dust{ position:absolute; inset:0; z-index:7; pointer-events:none; }
  .dust i{
    position:absolute;
    border-radius:50%;
    background:#8fff47;
    animation:drift var(--du,9s) linear var(--dl,0s) infinite,
              twinkle var(--tw,4s) ease-in-out var(--dl,0s) infinite;
  }
  .dust i.s{
    background:#c8ff8c;
    box-shadow:0 0 5px 1px rgba(150,255,80,.4);
    animation:drift var(--du,12s) linear var(--dl,0s) infinite,
              sparkle var(--sp,9s) ease-in-out var(--dl,0s) infinite;
  }
  .dust i.st{
    height:var(--h,5px) !important;
    border-radius:1px;
    animation:drift var(--du,14s) linear var(--dl,0s) infinite,
              twinkle var(--tw,6s) ease-in-out var(--dl,0s) infinite;
  }
  @keyframes drift{
    0%   { transform:translate3d(0,0,0); }
    50%  { transform:translate3d(calc(var(--dx,20px)*.55), calc(var(--dy,8px)*.6),0); }
    100% { transform:translate3d(var(--dx,20px), var(--dy,8px),0); }
  }
  @keyframes twinkle{
    0%,100% { opacity:var(--o,.5); }
    50%     { opacity:calc(var(--o,.5)*.25); }
  }
  @keyframes sparkle{
    0%,84%  { opacity:calc(var(--o,.8)*.12); box-shadow:0 0 2px rgba(160,255,90,.15); }
    88%     { opacity:calc(var(--o,.8)*1.05); box-shadow:0 0 9px 2px rgba(160,255,90,.8); }
    92%     { opacity:calc(var(--o,.8)*.8); }
    96%,100%{ opacity:calc(var(--o,.8)*.12); box-shadow:0 0 2px rgba(160,255,90,.15); }
  }

  /* ================= VIGNETTE ================= */
  .vignette{
    position:absolute; inset:0; z-index:8;
    background:radial-gradient(118% 132% at 44% 48%, transparent 58%, rgba(0,0,0,.62) 100%);
    pointer-events:none;
  }

  /* ================= AMBIENT LOOPS ================= */
  .streak.core{ animation:flicker 4.6s ease-in-out 2.2s infinite; }
  .streak.mid { animation:flicker 4.6s ease-in-out 2.4s infinite; }
  .fog        { animation:fogBreathe 5.6s ease-in-out 3s infinite; }
  .fog2       { animation:fogBreathe 6.4s ease-in-out 3.4s infinite; }
  .flare      { animation:tipPulse 3.4s ease-in-out 2.2s infinite; }
  .veil       { animation:tipPulse 4.2s ease-in-out 2.8s infinite; }
  .under      { animation:fogBreathe 7s ease-in-out 3.6s infinite; }
  .seam       { animation:seamPulse 3.1s ease-in-out 1.8s infinite; }
  .beam .tip  { animation:tipPulse 2.7s ease-in-out 1.6s infinite; }
  .label.right{ animation:textGlow 4.4s ease-in-out 2.8s infinite; }
  .pill       { animation:pillBreathe 5.2s ease-in-out 3s infinite; }

  @keyframes flicker{
    0%,100%{ opacity:1; filter:blur(var(--b,5px)) brightness(1); }
    12%    { opacity:.94; filter:blur(var(--b,5px)) brightness(1.1); }
    23%    { opacity:1; filter:blur(var(--b,5px)) brightness(.96); }
    38%    { opacity:.97; filter:blur(var(--b,5px)) brightness(1.05); }
    54%    { opacity:1; filter:blur(var(--b,5px)) brightness(.93); }
    71%    { opacity:.95; filter:blur(var(--b,5px)) brightness(1.09); }
    86%    { opacity:1; filter:blur(var(--b,5px)) brightness(.97); }
  }
  @keyframes seamPulse{
    0%,100%{ box-shadow:0 0 10px 1px rgba(90,255,30,.7), 0 0 34px 6px rgba(64,225,16,.34), 0 0 90px 22px rgba(46,180,12,.15); }
    45%    { box-shadow:0 0 14px 2px rgba(110,255,45,.85), 0 0 48px 9px rgba(74,235,22,.46), 0 0 110px 30px rgba(52,195,14,.2); }
  }
  @keyframes tipPulse{
    0%,100%{ opacity:1; }
    35%    { opacity:.8; }
    60%    { opacity:1; }
  }
  @keyframes fogBreathe{
    0%,100%{ opacity:1; }
    50%    { opacity:.9; }
  }
  @keyframes textGlow{
    0%,100%{ text-shadow:0 0 6px rgba(150,255,90,.22), 0 0 18px rgba(90,230,30,.12); }
    50%    { text-shadow:0 0 9px rgba(170,255,110,.36), 0 0 26px rgba(100,240,35,.22); }
  }
  @keyframes pillBreathe{
    0%,100%{ box-shadow:0 0 22px rgba(46,150,12,.09), inset -18px 0 24px -12px rgba(90,230,40,.13), inset 0 0 22px rgba(0,0,0,.5); }
    50%    { box-shadow:0 0 30px rgba(52,170,14,.15), inset -18px 0 24px -12px rgba(90,230,40,.13), inset 0 0 22px rgba(0,0,0,.5); }
  }

  /* ================= INTRO ================= */
  .stage.intro .grid  { animation:introFade .7s ease .05s both; }
  .stage.intro .seam  { animation:introSeam .5s cubic-bezier(.16,1,.3,1) .12s both; }
  .stage.intro .plus-ring{ animation:ringPop .9s cubic-bezier(.2,.8,.2,1) 1.1s both; }

  .stage.intro .streak.core,
  .stage.intro .streak.mid{ animation:introStreak .95s cubic-bezier(.16,1,.3,1) .18s both; }
  .stage.intro .streak.mid { animation-delay:.26s; }

  .stage.intro .fog,
  .stage.intro .fog2{ animation:introGlow 1.1s ease .34s both; }
  .stage.intro .fog2{ animation-delay:.42s; }
  .stage.intro .flare{ animation:introGlow 1s ease .5s both; }
  .stage.intro .veil { animation:introFade 1.4s ease .6s both; }
  .stage.intro .under{ animation:introFade 1.4s ease .7s both; }

  .stage.intro .beam .tip{ animation:introTip .6s cubic-bezier(.16,1,.3,1) .3s both; }
  .stage.intro .beam .column{ animation:introGlow 1s ease .4s both; }

  .stage.intro .pill{ animation:introPill .8s ease .5s both; }
  .stage.intro .plus{ animation:introPlus .55s cubic-bezier(.2,1.4,.3,1) .62s both; }
  .stage.intro .dust{ animation:introFade 1.2s ease .95s both; }

  .stage.intro .label .ch{
    opacity:0;
    animation:charIn .7s cubic-bezier(.16,1,.3,1) both;
    animation-delay:calc(var(--i)*.045s + var(--t,0s));
  }
  .stage.intro .pill .label .ch{ animation-delay:calc(var(--i)*.045s + .62s); }

  @keyframes introStreak{
    0%  { transform:scaleX(.02) scaleY(.6); opacity:0; filter:blur(var(--b,5px)) brightness(2.2); }
    45% { opacity:1; filter:blur(var(--b,5px)) brightness(1.6); }
    100%{ transform:scaleX(1) scaleY(1); opacity:1; filter:blur(var(--b,5px)) brightness(1); }
  }
  @keyframes introTip{
    0%  { opacity:0; transform:scale(.3); }
    100%{ opacity:1; transform:scale(1); }
  }
  @keyframes introGlow{
    0%  { opacity:0; transform:scale(.55); }
    100%{ opacity:1; transform:scale(1); }
  }
  @keyframes introSeam{
    0%  { transform:scaleY(.04); opacity:0; filter:brightness(3); }
    60% { opacity:1; }
    100%{ transform:scaleY(1); opacity:1; filter:brightness(1); }
  }
  @keyframes introPill{
    0%  { opacity:0; transform:scale(.965); }
    100%{ opacity:1; transform:scale(1); }
  }
  @keyframes introPlus{
    0%  { opacity:0; transform:rotate(-140deg) scale(.3); filter:brightness(3); }
    100%{ opacity:1; transform:rotate(0deg) scale(1); filter:brightness(1); }
  }
  @keyframes ringPop{
    0%  { transform:scale(1); opacity:.95; }
    100%{ transform:scale(3.4); opacity:0; }
  }
  @keyframes introFade{
    0%  { opacity:0; }
    100%{ opacity:1; }
  }
  @keyframes charIn{
    0%  { opacity:0; transform:translateY(11px); filter:blur(7px); }
    100%{ opacity:1; transform:translateY(0); filter:blur(0); }
  }

  /* ================= FLASH (click the pill) ================= */
  .stage.flash .streak.core{ animation:flicker 4.6s ease-in-out 2.2s infinite, flashStreak .7s ease-out; }
  .stage.flash .seam{ animation:seamPulse 3.1s ease-in-out 1.8s infinite, flashSeam .7s ease-out; }
  .stage.flash .beam .tip{ animation:tipPulse 2.7s ease-in-out 1.6s infinite, flashTip .7s ease-out; }
  .stage.flash .fog{ animation:fogBreathe 5.6s ease-in-out 3s infinite, flashBloom .7s ease-out; }
  .stage.flash .fog2{ animation:fogBreathe 6.4s ease-in-out 3.4s infinite, flashBloom .7s ease-out; }
  @keyframes flashStreak{
    0%  { filter:blur(var(--b,5px)) brightness(1); }
    25% { filter:blur(calc(var(--b,5px) - 1px)) brightness(1.55); }
    100%{ filter:blur(var(--b,5px)) brightness(1); }
  }
  @keyframes flashSeam{
    0%  { box-shadow:0 0 10px 1px rgba(90,255,30,.7), 0 0 34px 6px rgba(64,225,16,.34), 0 0 90px 22px rgba(46,180,12,.15); }
    30% { box-shadow:0 0 18px 3px rgba(140,255,60,1), 0 0 70px 14px rgba(90,240,30,.7), 0 0 150px 44px rgba(60,205,20,.35); }
    100%{ box-shadow:0 0 10px 1px rgba(90,255,30,.7), 0 0 34px 6px rgba(64,225,16,.34), 0 0 90px 22px rgba(46,180,12,.15); }
  }
  @keyframes flashTip{
    0%,100%{ opacity:1; filter:brightness(1); }
    25% { opacity:1; filter:brightness(2); }
  }
  @keyframes flashBloom{
    0%  { opacity:.9; transform:scale(1); }
    30% { opacity:1; transform:scale(1.12); }
    100%{ opacity:.9; transform:scale(1); }
  }
  .stage.flash .plus-ring{ animation:ringPop .7s cubic-bezier(.2,.8,.2,1); }

</style>
</head>
<body>

<div class="viewport">
  <div class="stage" id="stage">

    <!-- ambient wash -->
    <div class="ambient"></div>

    <!-- beam -->
    <div class="beam-group">
      <div class="beam" id="beam">
        <div class="streak core"></div>
        <div class="streak mid"></div>
        <div class="fog2"></div>
        <div class="fog"></div>
        <div class="flare"></div>
        <div class="under"></div>
        <div class="veil"></div>
        <div class="column"></div>
        <div class="tip"></div>
      </div>
    </div>

    <!-- grid (screen-blend: the beam lights the lines) -->
    <div class="grid">
      <i class="v v1"></i><i class="v v2"></i><i class="v v3"></i><i class="v v4"></i>
      <i class="v v5"></i><i class="v v6"></i><i class="v v7"></i><i class="v v8"></i>
      <i class="h h1"></i><i class="h h2"></i><i class="h h3"></i>
    </div>

    <!-- pill -->
    <div class="pill" id="pill">
      <span class="label left" data-text="SIMPLIFY"></span>
    </div>

    <!-- seam -->
    <div class="seam"></div>
    <div class="seam-tail"></div>

    <!-- plus + right label -->
    <div class="plus">
      <svg viewBox="0 0 19 19" fill="none">
        <path d="M9.5 1.8v15.4M1.8 9.5h15.4" stroke="#41ff00" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="plus-ring"></div>

    <div class="label right" data-text="YOUR SUCCESS"></div>

    <!-- dust -->
    <div class="dust" id="dust"></div>

    <!-- vignette -->
    <div class="vignette"></div>
  </div>
</div>


<script>
  /* ---------- scale the fixed 756×315 stage to the viewport ---------- */
  const stage = document.getElementById('stage');
  function fit(){
    const s = Math.min(window.innerWidth/756, window.innerHeight/315);
    stage.style.transform = 'scale(' + s + ')';
  }
  addEventListener('resize', fit); fit();

  /* ---------- wrap label letters for the staggered intro ---------- */
  document.querySelectorAll('.label').forEach(lb=>{
    const txt = lb.dataset.text;
    const t0 = lb.classList.contains('left') ? .62 : .44;
    lb.innerHTML = [...txt].map((c,i)=>
      '<span class="ch" style="--i:'+i+';--t:'+t0+'s">'+c+'</span>'
    ).join('');
  });

  /* ---------- dust particles ---------- */
  const dust = document.getElementById('dust');
  const rand=(a,b)=>a+Math.random()*(b-a);
  const CENTER=157;
  for(let i=0;i<52;i++){
    const p = document.createElement('i');
    const x = Math.random() < .85 ? rand(364, 664) : rand(664, 694);
    const y = 40 + (Math.random()+Math.random()+Math.random())/3 * 235;
    const d = Math.abs(y-CENTER);
    const core = Math.exp(-(d*d)/(2*56*56));
    const size = rand(.7, 1.7);
    const o = rand(.14,.6) * (.3 + .7*core);
    const kind = Math.random();
    const cls = kind<.1 ? 's' : (kind<.16 ? 'st' : '');
    p.className = cls;
    p.style.cssText =
      'left:'+x.toFixed(1)+'px; top:'+y.toFixed(1)+'px;' +
      'width:'+(cls==='st'?'1.2':size.toFixed(2))+'px; height:'+(cls==='st'?rand(3.5,6).toFixed(1):size.toFixed(2))+'px;' +
      '--o:'+o.toFixed(2)+';' +
      '--dx:'+rand(-30,44).toFixed(1)+'px; --dy:'+rand(-16,16).toFixed(1)+'px;' +
      '--du:'+rand(6,15).toFixed(1)+'s; --tw:'+rand(2.2,6.5).toFixed(1)+'s; --dl:'+rand(-8,0).toFixed(1)+'s;' +
      '--sp:'+rand(7,12).toFixed(1)+'s;' +
      (cls!=='st' ? 'box-shadow:0 0 '+(size*3).toFixed(1)+'px rgba(140,255,70,'+(.3*Math.max(.35,core)).toFixed(2)+');' : '');
    dust.appendChild(p);
  }

  /* ---------- intro ---------- */
  /* The intro class is removed on a fixed timer (not on animationend),
     otherwise the first animation that finishes cancels the rest of the
     sequence (letter stagger, plus-ring) mid-flight. */
  let introTimer = null;
  function playIntro(){
    clearTimeout(introTimer);
    stage.classList.remove('intro');
    void stage.offsetWidth;               /* restart animations */
    stage.classList.add('intro');
    introTimer = setTimeout(()=>stage.classList.remove('intro'), 2150);
  }
  playIntro();

  /* ---------- click the pill → light pulse ---------- */
  document.getElementById('pill').addEventListener('click', ()=>{
    stage.classList.remove('flash');
    void stage.offsetWidth;
    stage.classList.add('flash');
    setTimeout(()=>stage.classList.remove('flash'), 750);
  });
</script>

</body>
